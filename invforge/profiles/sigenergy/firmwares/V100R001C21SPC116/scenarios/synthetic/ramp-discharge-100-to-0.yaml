# Synthetic scenario -- NOT captured from a real device (contrast with
# scenarios/recorded/). Linear SoC ramp 100%->0% over 60s at a constant
# ~5kW discharge, off-grid throughout, discharge cutoff at 10%. Per
# docs/test-plan.md's scenario matrix: validates battery.charge tracking,
# LB triggering at ess_discharge_cutoff_soc, and battery.runtime shrinking
# plausibly as SoC falls -- once the driver exists to assert against.
static:
  unit_247:
    30047: 8800    # ess_avail_max_charge_power (gain 1000 -> 8.8 kW)
    30049: 9600    # ess_avail_max_discharge_power (gain 1000 -> 9.6 kW)
    30064: 1800    # ess_avail_max_charge_capacity (gain 100 -> 18.0 kWh)
    30066: 1800    # ess_avail_max_discharge_capacity (gain 100 -> 18.0 kWh)
    30068: 8800    # ess_rated_charge_power
    30070: 9600    # ess_rated_discharge_power
    30083: 1800    # ess_rated_energy_capacity (gain 100 -> 18.0 kWh)
    30085: 1000    # ess_charge_cutoff_soc (gain 10 -> 100.0%)
    30086: 100     # ess_discharge_cutoff_soc (gain 10 -> 10.0%) -- LB should trip here
    30087: 980     # ess_soh (gain 10 -> 98.0%)
  unit_1:
    30500: "SigenStor SYNTHETIC"     # clearly not a real model string
    30515: "SYNTH-0001"
    30525: "0.0.0-synthetic"

timeseries:
  - { t: 0,  30004: 1, 30009: 1, 30051: 1, 30014: 1000, 30037: -5000, 30005: 0, 30035: 0, 30027: 0, 30028: 0, 30029: 0, 30030: 0, 30072: 0, 30280: 0 }
  - { t: 6,  30014: 900,  30037: -5000 }
  - { t: 12, 30014: 800,  30037: -5000 }
  - { t: 18, 30014: 700,  30037: -5000 }
  - { t: 24, 30014: 600,  30037: -5000 }
  - { t: 30, 30014: 500,  30037: -5000 }
  - { t: 36, 30014: 400,  30037: -5000 }
  - { t: 42, 30014: 300,  30037: -5000 }
  - { t: 48, 30014: 200,  30037: -5000 }
  - { t: 54, 30014: 100,  30037: -5000 }
  - { t: 60, 30014: 0,    30037: 0 }     # empty, discharge stops
