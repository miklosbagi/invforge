# Synthetic scenario -- NOT captured from a real device. Deliberately
# wire-legal but semantically impossible: pv_plant_power (S32, gain
# 1000) can represent negative values on the wire, but PV generation is
# physically magnitude-only -- a real panel/inverter fault or a
# corrupted read could hand a driver a negative value with no
# protocol-level error. Chosen over ess_power/grid_active_power, which
# are legitimately bidirectional by design (charge/discharge,
# import/export) -- this is the clean "negative where it shouldn't be"
# case. Exercises whether a NUT driver clamps/rejects it rather than
# propagating a nonsensical negative generation figure downstream.
static:
  unit_247:
    30047: 8800    # ess_avail_max_charge_power (gain 1000 -> 8.8 kW)
    30049: 9600    # ess_avail_max_discharge_power (gain 1000 -> 9.6 kW)
    30064: 1800    # ess_avail_max_charge_capacity (gain 100 -> 18.0 kWh)
    30066: 1800    # ess_avail_max_discharge_capacity (gain 100 -> 18.0 kWh)
    30068: 8800    # ess_rated_charge_power
    30070: 9600    # ess_rated_discharge_power
    30083: 1800    # ess_rated_energy_capacity (gain 100 -> 18.0 kWh)
    30085: 1000    # ess_charge_cutoff_soc (gain 10 -> 100.0%)
    30086: 100     # ess_discharge_cutoff_soc (gain 10 -> 10.0%)
    30087: 1000    # ess_soh (gain 10 -> 100.0%, normal)
    30004: 0       # grid_sensor_status
    30005: 0       # grid_active_power
    30009: 0       # on_off_grid_status
    30014: 550     # ess_soc (gain 10 -> 55.0%, normal)
    30027: 0
    30028: 0
    30029: 0
    30030: 0
    30035: -500    # pv_plant_power (gain 1000 -> -0.5 kW -- INVALID, PV can't be negative)
    30037: 0       # ess_power (idle)
    30051: 1       # plant_running_state
    30072: 0
    30280: 0
  unit_1:
    30500: "SigenStor SYNTHETIC-BADDATA"
    30515: "SYNTH-BADDATA-0003"
    30525: "0.0.0-synthetic"
