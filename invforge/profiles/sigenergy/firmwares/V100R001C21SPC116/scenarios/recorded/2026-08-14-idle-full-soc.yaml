# Real register readings, captured live from sigenergy-inverter-0.energy.mb:502
# on 2026-08-14 across several read-only sessions during the same steady
# idle state (battery full, no load, no PV, not yet grid-tied/commissioned
# for export). Not a single atomic register dump -- unit 1's fields (which
# can't vary over this engine's timeseries, only unit 247's default-unit
# registers can) are frozen at one representative moment; unit 247's
# timeseries samples below carry the small real sensor jitter actually
# observed across multiple reads a few seconds apart, not invented noise.
#
# Notable real detail worth preserving, not smoothing away: the inverter's
# own lifetime PV total generation (31511-31512) reads only ~12.9 kWh --
# consistent with a very recently commissioned installation, matching the
# "can't export to grid yet" state this capture was taken in.
